<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Solution Administrative</title>
    <meta name="description" content="Gestion RH et administrative multi-sites — pointage, congés, sanctions, caisse, personnel." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Installable on iOS: Safari ignores the web manifest for these bits. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solution Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Applied before React mounts so the page never flashes the wrong
      // theme on load. ThemeContext takes over (and stays in sync) after.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
